<div class="app-shell">
  <app-dashboard (notice)="showNotice($event)" />
  <app-footer />
  @if (notice) {
    <div class="toast" role="status">
      {{ notice }}
      <button aria-label="Dismiss message" (click)="notice = ''">
        <svg lucideX [size]="15"></svg>
      </button>
    </div>
  }
</div>
