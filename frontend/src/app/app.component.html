<div class="app-shell">
  <app-dashboard (notice)="showNotice($event)" />
  <app-footer />
  @if (notice(); as message) {
    <div class="toast" role="status">
      {{ message }}
      <button aria-label="Dismiss message" (click)="dismissNotice()">
        <svg lucideX [size]="15"></svg>
      </button>
    </div>
  }
</div>
