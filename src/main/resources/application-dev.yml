spring:
  datasource:
    url: "${DATABASE_URL:jdbc:h2:mem:pos_app;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: "${DATABASE_USERNAME:sa}"
    password: "${DATABASE_PASSWORD:}"
    driver-class-name: "org.h2.Driver"
  h2:
    console:
      enabled: "true"
      path: "/h2-console"
  jpa:
    hibernate:
      ddl-auto: "update"
    open-in-view: "false"
    properties:
      hibernate:
        format_sql: "true"
